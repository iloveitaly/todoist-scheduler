[project]
name = "todoist-scheduler"
version = "0.6.0"
description = "Automatically reschedule tasks in Todoist to reduce the size of the todo lists you see each day."
keywords = ["todoist", "scheduler", "task", "management"]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "apscheduler>=3.10.4",
    "backoff>=2.2.1",
    "click>=8.1.7",
    "httpx>=0.28.1",
    "pyjson5>=1.6.6",
    "python-decouple-typed>=3.11.0",
    "regex>=2024.7.24",
    "requests>=2.32.0",
    "structlog>=24.4",
    "todoist-api-python>=4.0.0",
]
authors = [{ name = "Michael Bianco", email = "mike@mikebian.co" }]
urls = { "Repository" = "https://github.com/iloveitaly/todoist-scheduler" }

# additional packaging information: https://packaging.python.org/en/latest/specifications/core-metadata/#license
[project.scripts]
todoist-scheduler = "todoist_scheduler:cli"

[build-system]
requires = ["uv_build>=0.11.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# avoids the src/ directory structure
module-root = ""

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pyright[nodejs]>=1.1.408",
    "ruff>=0.15.0",
    "coverage>=7.13.4",
    "pytest-cov>=7.0.0",
    "covdefaults>=2.3.0",
    "beautiful-traceback>=1.0.2",
]

[tool.pyright]
exclude = [
    "examples/",
    "playground/",
    "playground.py",
    "tmp/",
    ".venv/",
    "tests/",
    "todoist_scheduler/archive.py",
]

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing --cov-report=html:tmp/htmlcov"

[tool.coverage.run]
plugins = ["covdefaults"]
source = ["todoist_scheduler"]
omit = ["todoist_scheduler/archive.py"]

[tool.coverage.report]
fail_under = 50
